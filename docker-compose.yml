services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: elearning
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: