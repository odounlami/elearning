<main class="grid min-h-[calc(100vh-72px)] place-items-center px-5 py-12"><section class="w-full max-w-105 rounded-3xl border border-line bg-white p-7 shadow-sm sm:p-9"><p class="font-mono text-xs uppercase tracking-widest text-orange">Premier chapitre</p><h1 class="mt-2 font-display text-4xl font-bold">Créez votre bibliothèque.</h1><p class="mt-3 text-sm leading-6 text-muted">Un compte suffit pour sauvegarder vos formations et votre progression.</p>@if(error){<div class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{error}}</div>}<form [formGroup]="form" (ngSubmit)="submit()" class="mt-7 space-y-4"><label class="block"><span class="mb-1.5 block text-sm font-semibold">Nom</span><input formControlName="name" class="w-full rounded-xl border border-line bg-cream px-4 py-3"></label><label class="block"><span class="mb-1.5 block text-sm font-semibold">Email</span><input formControlName="email" type="email" class="w-full rounded-xl border border-line bg-cream px-4 py-3"></label><label class="block"><span class="mb-1.5 block text-sm font-semibold">Mot de passe</span><input formControlName="password" type="password" class="w-full rounded-xl border border-line bg-cream px-4 py-3"></label><label class="block"><span class="mb-1.5 block text-sm font-semibold">Confirmer le mot de passe</span><input formControlName="confirmPassword" type="password" class="w-full rounded-xl border border-line bg-cream px-4 py-3"></label><button [disabled]="loading" class="w-full rounded-xl bg-ink py-3.5 font-semibold text-cream">{{loading?'Création...':'Créer mon compte'}}</button></form><p class="mt-6 text-center text-sm text-muted">Déjà inscrit ? <a routerLink="/login" class="font-semibold text-orange">Se connecter</a></p></section></main>
