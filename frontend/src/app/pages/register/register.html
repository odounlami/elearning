@if(error()){<div class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{error()}}</div>}
<form [formGroup]="form" (ngSubmit)="submit()" class="mt-5 grid gap-3">
  <label><span class="mb-1 block text-sm font-semibold">Nom</span><input formControlName="name" autocomplete="name" class="w-full rounded-xl border border-line bg-cream px-4 py-2.5 outline-none focus:ring-2 focus:ring-orange">@if(form.controls.name.touched && form.controls.name.invalid){<span class="mt-1 block text-xs text-red-700">Le nom doit contenir au moins 2 caractères.</span>}</label>
  <label><span class="mb-1 block text-sm font-semibold">Email</span><input formControlName="email" type="email" autocomplete="email" class="w-full rounded-xl border border-line bg-cream px-4 py-2.5 outline-none focus:ring-2 focus:ring-orange">@if(form.controls.email.touched && form.controls.email.invalid){<span class="mt-1 block text-xs text-red-700">Entrez une adresse email valide.</span>}</label>
  <div class="grid gap-3 sm:grid-cols-2">
    <label><span class="mb-1 block text-sm font-semibold">Mot de passe</span><input formControlName="password" type="password" autocomplete="new-password" class="w-full rounded-xl border border-line bg-cream px-4 py-2.5 outline-none focus:ring-2 focus:ring-orange">@if(form.controls.password.touched && form.controls.password.invalid){<span class="mt-1 block text-xs text-red-700">8 caractères minimum.</span>}</label>
    <label><span class="mb-1 block text-sm font-semibold">Confirmation</span><input formControlName="confirmPassword" type="password" autocomplete="new-password" class="w-full rounded-xl border border-line bg-cream px-4 py-2.5 outline-none focus:ring-2 focus:ring-orange">@if(form.controls.confirmPassword.touched && form.controls.confirmPassword.value !== form.controls.password.value){<span class="mt-1 block text-xs text-red-700">Les mots de passe ne correspondent pas.</span>}</label>
  </div>
  <button [disabled]="loading()" class="mt-1 w-full rounded-xl bg-ink py-3 font-semibold text-cream transition hover:bg-orange disabled:opacity-60">{{loading()?'Création...':'Créer mon compte'}}</button>
</form>
