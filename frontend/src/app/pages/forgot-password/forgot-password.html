<main class="grid min-h-[calc(100vh-144px)] place-items-center px-5 py-8"><section class="js-reveal w-full max-w-105 rounded-3xl border border-line bg-white p-7 shadow-sm sm:p-8"><p class="font-mono text-xs uppercase tracking-widest text-orange">Accès au compte</p><h1 class="mt-2 font-display text-4xl font-bold">Mot de passe oublié ?</h1>@if(!sent){<p class="mt-3 text-sm leading-6 text-muted">Entrez votre adresse email. Nous vous indiquerons comment récupérer votre compte.</p><form (ngSubmit)="submit()" class="mt-6 space-y-4"><label class="block"><span class="mb-1 block text-sm font-semibold">Email</span><input [(ngModel)]="email" name="email" required type="email" autocomplete="email" class="w-full rounded-xl border border-line bg-cream px-4 py-3 outline-none focus:ring-2 focus:ring-orange"></label><button class="w-full rounded-xl bg-orange py-3.5 font-semibold text-white">Continuer</button></form>}@else{<div class="mt-6 rounded-2xl bg-paper p-5 text-sm leading-6 text-muted">Si cette adresse correspond à un compte, les instructions de récupération seront envoyées à cette adresse.</div>}<p class="mt-6 text-center text-sm text-muted"><a routerLink="/login" class="font-semibold text-orange">← Retour à la connexion</a></p></section></main>
