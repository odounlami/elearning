<main class="grid min-h-[calc(100vh-144px)] place-items-center px-5 py-8">
  <section class="js-reveal w-full max-w-105 rounded-3xl border border-line bg-white p-7 shadow-sm sm:p-8">
    <p class="font-mono text-xs uppercase tracking-widest text-orange">Bon retour</p>
    <h1 class="mt-2 font-display text-4xl font-bold">Ouvrir son chapitre.</h1>
    <p class="mt-3 text-sm leading-6 text-muted">Retrouvez votre bibliothèque et votre progression.</p>
    @if(error){<div class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{error}}</div>}
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-3.5">
      <label class="block"><span class="mb-1 block text-sm font-semibold">Email</span><input formControlName="email" type="email" autocomplete="email" class="w-full rounded-xl border border-line bg-cream px-4 py-3 outline-none focus:ring-2 focus:ring-orange"></label>
      <label class="block"><span class="mb-1 block text-sm font-semibold">Mot de passe</span><input formControlName="password" type="password" autocomplete="current-password" class="w-full rounded-xl border border-line bg-cream px-4 py-3 outline-none focus:ring-2 focus:ring-orange"></label>
      <div class="flex justify-end"><a routerLink="/forgot-password" class="text-xs font-semibold text-orange">Mot de passe oublié ?</a></div>
      <button [disabled]="loading" class="w-full rounded-xl bg-orange py-3.5 font-semibold text-white transition hover:bg-orange-dark disabled:opacity-60">{{loading?'Connexion...':'Se connecter'}}</button>
    </form>
    <p class="mt-5 text-center text-sm text-muted">Pas encore de compte ? <a routerLink="/register" class="font-semibold text-orange">S'inscrire</a></p>
  </section>
</main>
