<header class="sticky top-0 z-50 border-b border-line/70 bg-cream/95 backdrop-blur">
  <div class="mx-auto flex h-18 max-w-310 items-center justify-between px-5 lg:px-8">
    <a routerLink="/" class="font-display text-2xl font-bold text-ink">Level<span class="text-orange"> Up.</span></a>
    <button class="rounded-lg p-2 lg:hidden" (click)="menuOpen=!menuOpen" aria-label="Menu"><span class="block h-0.5 w-6 bg-ink"></span><span class="my-1.5 block h-0.5 w-6 bg-ink"></span><span class="block h-0.5 w-6 bg-ink"></span></button>
    <nav class="hidden items-center gap-8 lg:flex">
      <a routerLink="/courses" routerLinkActive="text-orange" class="text-sm font-semibold text-muted">Formations</a>
      @if(auth.isAuthenticated()){
        <a routerLink="/dashboard" routerLinkActive="text-orange" class="text-sm font-semibold text-muted">Ma bibliothèque</a>
        <span class="h-5 w-px bg-line"></span>
        <a routerLink="/dashboard" class="text-sm font-semibold text-ink transition hover:text-orange">Mon compte</a>
        <button (click)="auth.logout()" class="text-sm font-semibold text-orange">Déconnexion</button>
      }@else{
        <a routerLink="/login" class="text-sm font-semibold text-muted">Connexion</a>
        <a routerLink="/register" class="rounded-full bg-ink px-5 py-2.5 text-sm font-semibold text-cream">S'inscrire</a>
      }
    </nav>
  </div>
  @if(menuOpen){
    <nav class="border-t border-line bg-cream px-5 py-4 lg:hidden">
      <div class="mx-auto flex max-w-310 flex-col gap-4">
        <a routerLink="/courses" (click)="menuOpen=false">Formations</a>
        @if(auth.isAuthenticated()){
          <a routerLink="/dashboard" (click)="menuOpen=false">Ma bibliothèque</a>
          <a routerLink="/dashboard" (click)="menuOpen=false" class="font-semibold">Mon compte</a>
          <button class="text-left text-orange" (click)="auth.logout();menuOpen=false">Déconnexion</button>
        }@else{
          <a routerLink="/login" (click)="menuOpen=false">Connexion</a>
          <a routerLink="/register" (click)="menuOpen=false" class="font-semibold text-orange">S'inscrire</a>
        }
      </div>
    </nav>
  }
</header>
