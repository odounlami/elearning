<a [routerLink]="['/courses', course().id]" class="group block">
  <article class="rounded-2xl border border-line bg-cream p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-[10px] font-semibold uppercase tracking-widest text-orange">{{course().domain}}</p>
        <h3 class="mt-3 font-display text-2xl font-bold leading-tight">{{course().title}}</h3>
      </div>
      @if(inLibrary()) {
        <span class="shrink-0 rounded-full bg-paper px-3 py-1.5 text-xs font-semibold text-ink">✓ Déjà ajouté</span>
      }
    </div>
    <p class="mt-4 line-clamp-3 text-sm leading-6 text-muted">{{course().description}}</p>
    <div class="mt-6 flex items-center justify-between gap-3 border-t border-line pt-4 text-sm">
      <div class="flex flex-wrap items-center gap-2">
        <span class="rounded-full bg-paper px-2.5 py-1 text-[10px] font-semibold">{{course().level}}</span>
        <span class="text-muted">{{course().modules.length}} modules · {{course().language}}</span>
      </div>
      <span class="font-semibold text-orange transition group-hover:translate-x-1">{{inLibrary() ? 'Voir →' : 'Découvrir →'}}</span>
    </div>
  </article>
</a>
