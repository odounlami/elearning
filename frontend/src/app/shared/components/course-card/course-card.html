<a [routerLink]="['/courses', course().id]" class="group block h-full">
  <article class="flex h-full min-h-130 flex-col overflow-hidden rounded-3xl border border-line bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl">
    <div [class]="visualVariant()" class="flex min-h-70 flex-col justify-between p-7 sm:p-8">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="font-mono text-[10px] font-semibold uppercase tracking-widest opacity-70">{{course().domain}}</p>
          <p class="mt-2 font-mono text-[10px] uppercase tracking-widest opacity-60">{{course().level}} · {{course().language}}</p>
        </div>
        @if(inLibrary()) {
          <span class="shrink-0 font-mono text-[10px] uppercase tracking-widest opacity-70">✓ Ajouté</span>
        }
      </div>
      <div class="mt-10">
        <h3 class="max-w-2xl font-display text-3xl font-bold leading-tight sm:text-4xl">{{course().title}}</h3>
        <p class="mt-3 text-sm opacity-70">{{course().instructor}}</p>
      </div>
    </div>
    <div class="flex flex-1 flex-col border-t border-line bg-white p-6 sm:p-7">
      <p class="min-h-18 line-clamp-3 text-sm leading-6 text-muted">{{course().description}}</p>
      <div class="mt-auto flex items-center justify-between gap-4 border-t border-line pt-5">
        <span class="text-sm text-muted">{{course().modules.length}} modules</span>
        <span class="font-semibold text-orange transition group-hover:translate-x-1 group-hover:text-ink">{{inLibrary() ? 'Voir →' : 'Découvrir →'}}</span>
      </div>
    </div>
  </article>
</a>
